default_provider: ollama

providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434
  claude:
    type: claude
    api_key: ${CLAUDE_API_KEY}
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
  deepseek:
    type: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com

models:
  ollama:
    - deepseek-r1:8b
    - deepseek-r1:14b
    - qwen2.5:7b
  claude:
    - claude-opus-4-7
    - claude-sonnet-4-6
    - claude-haiku-4-5
  openai:
    - gpt-4o
    - gpt-4o-mini
  deepseek:
    - deepseek-chat
    - deepseek-reasoner

defaults:
  analyze:
    provider: ollama
    model: deepseek-r1:8b
  generate_questions:
    provider: ollama
    model: deepseek-r1:8b
  improve_writing:
    provider: claude
    model: claude-sonnet-4-6
  chat:
    provider: claude
    model: claude-sonnet-4-6
