default_provider: ollama

providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434
  deepseek:
    type: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
  claude:
    type: claude
    api_key: ${CLAUDE_API_KEY}
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}

embedding:
  provider: ollama
  model: bge-m3:latest

models:
  ollama:
    - qwen3.5:9b
    - qwen3:8b
    - deepseek-r1:8b
    - qwen3.6:27b
  claude:
    - claude-opus-4-7
    - claude-sonnet-4-6
    - claude-haiku-4-5
  openai:
    - gpt-4o
    - gpt-4o-mini
  deepseek:
    - deepseek-v4-flash
    - deepseek-v4-pro

defaults:
  analyze:
    provider: ollama
    model: qwen3:8b
  generate_questions:
    provider: ollama
    model: qwen3:8b
  improve_writing:
    provider: ollama
    model: qwen3:8b
  chat:
    provider: ollama
    model: qwen3:8b
  extract:
    provider: ollama
    model: qwen3:8b
  discover_relationships:
    provider: ollama
    model: qwen3:8b
  suggest_related:
    provider: ollama
    model: qwen3:8b
  discover_gaps:
    provider: ollama
    model: qwen3:8b
  generate_learning_path:
    provider: ollama
    model: qwen3:8b
  optimize_review_plan:
    provider: ollama
    model: qwen3:8b
